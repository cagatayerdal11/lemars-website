<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Caricature-style drink illustration -->
  <!-- Oversized wine bottle (left) -->
  <g opacity="0.85">
    <rect x="80" y="140" width="70" height="280" rx="12" fill="#c44a3d"/>
    <rect x="100" y="60" width="30" height="90" rx="8" fill="#c44a3d"/>
    <rect x="90" y="130" width="50" height="8" rx="4" fill="#a33228"/>
    <rect x="85" y="210" width="60" height="80" rx="6" fill="#a33228" opacity="0.5"/>
    <rect x="95" y="230" width="40" height="4" rx="2" fill="#ddd" opacity="0.4"/>
    <rect x="100" y="242" width="30" height="3" rx="1.5" fill="#ddd" opacity="0.3"/>
    <rect x="95" y="254" width="40" height="4" rx="2" fill="#ddd" opacity="0.4"/>
    <ellipse cx="115" cy="420" rx="38" ry="6" fill="#2a1a14" opacity="0.15"/>
  </g>

  <!-- Tall beer bottle (center-left) -->
  <g opacity="0.8">
    <rect x="200" y="170" width="55" height="250" rx="10" fill="#d4a643"/>
    <rect x="215" y="100" width="25" height="80" rx="7" fill="#d4a643"/>
    <rect x="207" y="160" width="40" height="7" rx="3.5" fill="#b8902e"/>
    <rect x="205" y="240" width="44" height="70" rx="5" fill="#b8902e" opacity="0.45"/>
    <rect x="212" y="258" width="30" height="3" rx="1.5" fill="#fff" opacity="0.35"/>
    <rect x="216" y="268" width="22" height="2.5" rx="1.25" fill="#fff" opacity="0.25"/>
    <rect x="212" y="278" width="30" height="3" rx="1.5" fill="#fff" opacity="0.35"/>
    <ellipse cx="228" cy="420" rx="30" ry="5" fill="#2a1a14" opacity="0.12"/>
  </g>

  <!-- Short round bottle (center) -->
  <g opacity="0.75">
    <rect x="330" y="220" width="80" height="200" rx="20" fill="#5a8a6e"/>
    <rect x="355" y="150" width="30" height="80" rx="8" fill="#5a8a6e"/>
    <rect x="340" y="210" width="60" height="8" rx="4" fill="#467858"/>
    <rect x="342" y="280" width="56" height="60" rx="8" fill="#467858" opacity="0.45"/>
    <rect x="350" y="298" width="40" height="3" rx="1.5" fill="#ddd" opacity="0.35"/>
    <rect x="355" y="308" width="30" height="2.5" rx="1.25" fill="#ddd" opacity="0.25"/>
    <ellipse cx="370" cy="420" rx="42" ry="6" fill="#2a1a14" opacity="0.12"/>
  </g>

  <!-- Cocktail glass (right-center) -->
  <g opacity="0.85">
    <path d="M480 130 L530 280 Q530 290 520 290 L490 290 Q480 290 480 280 Z" fill="#e06050" opacity="0.25"/>
    <path d="M460 130 L550 130 L515 265 L495 265 Z" fill="none" stroke="#e06050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="505" y1="265" x2="505" y2="360" stroke="#e06050" stroke-width="4" stroke-linecap="round"/>
    <line x1="475" y1="360" x2="535" y2="360" stroke="#e06050" stroke-width="5" stroke-linecap="round"/>
    <!-- Liquid in glass -->
    <path d="M472 160 L538 160 L518 245 L492 245 Z" fill="#e06050" opacity="0.2"/>
    <!-- Garnish - lemon slice -->
    <circle cx="540" cy="140" r="18" fill="#d4a643" opacity="0.6"/>
    <circle cx="540" cy="140" r="12" fill="#e8c060" opacity="0.5"/>
    <line x1="540" y1="128" x2="540" y2="152" stroke="#d4a643" stroke-width="1.5" opacity="0.6"/>
    <line x1="528" y1="140" x2="552" y2="140" stroke="#d4a643" stroke-width="1.5" opacity="0.6"/>
    <!-- Straw -->
    <line x1="520" y1="90" x2="498" y2="200" stroke="#c44a3d" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="505" cy="362" rx="32" ry="5" fill="#2a1a14" opacity="0.1"/>
  </g>

  <!-- Wine glass (right) -->
  <g opacity="0.8">
    <ellipse cx="660" cy="230" rx="50" ry="70" fill="none" stroke="#c44a3d" stroke-width="4"/>
    <ellipse cx="660" cy="230" rx="46" ry="66" fill="#c44a3d" opacity="0.12"/>
    <!-- Wine in glass -->
    <path d="M618 250 Q618 280 660 285 Q702 280 702 250 Z" fill="#c44a3d" opacity="0.25"/>
    <line x1="660" y1="300" x2="660" y2="370" stroke="#c44a3d" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="660" cy="375" rx="40" ry="10" fill="none" stroke="#c44a3d" stroke-width="4"/>
    <ellipse cx="660" cy="385" rx="40" ry="5" fill="#2a1a14" opacity="0.1"/>
  </g>

  <!-- Decorative bubbles / dots -->
  <circle cx="150" cy="100" r="6" fill="#e06050" opacity="0.2"/>
  <circle cx="300" cy="80" r="4" fill="#d4a643" opacity="0.2"/>
  <circle cx="450" cy="95" r="8" fill="#e06050" opacity="0.15"/>
  <circle cx="600" cy="110" r="5" fill="#c44a3d" opacity="0.2"/>
  <circle cx="720" cy="150" r="7" fill="#d4a643" opacity="0.15"/>
  <circle cx="170" cy="380" r="5" fill="#d4a643" opacity="0.15"/>
  <circle cx="280" cy="400" r="4" fill="#e06050" opacity="0.12"/>
  <circle cx="580" cy="350" r="6" fill="#c44a3d" opacity="0.15"/>
</svg>
